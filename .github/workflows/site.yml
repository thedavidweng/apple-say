name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "public/screenshot.webp"
      - "Resources/AppIcon.webp"
  release:
    types: [published]
  schedule:
    # Catches releases created by release-please (GITHUB_TOKEN events
    # do not trigger the release event above).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 60
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Assemble site with latest release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp public/screenshot.webp site/assets/screenshot.webp
          cp Resources/AppIcon.webp site/assets/icon.webp
          TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name || git describe --tags --abbrev=0)
          echo "Injecting version: $TAG"
          sed -i "s/{{APP_VERSION}}/${TAG#v}/g" site/index.html site/zh/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

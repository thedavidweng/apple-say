name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint

      - parallel:
          - name: Run SwiftLint (Strict Mode)
            run: swiftlint lint --strict

          - name: Run test suite (Zero Warnings)
            run: swift test -Xswiftc -warnings-as-errors

      - name: Package release artifacts
        run: ./scripts/package-release.sh

      - name: Determine tag name
        id: vars
        run: |
          if [ -n "${INPUTS_TAG_NAME}" ]; then
            echo "tag=${INPUTS_TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_TAG_NAME: ${{ github.event.inputs.tag_name }}

      # v3.0.3 reuses the release created by release-please and supports rerun uploads.
      - name: Create GitHub Release
        # v3.0.3; required create/update release semantics.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/Apple-Say.dmg
            dist/Apple-Say.zip
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

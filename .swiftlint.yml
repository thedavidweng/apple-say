# .swiftlint.yml - Strict Swift 6 code quality configuration

included:
  - Sources
  - Tests

excluded:
  - .build
  - build
  - dist
  - Package.swift

opt_in_rules:
  - redundant_nil_coalescing
  - empty_count
  - contains_over_first_not_nil
  - fatal_error_message
  - weak_delegate

disabled_rules:
  - optional_data_string_conversion

line_length:
  warning: 160
  error: 240
  ignores_comments: true
  ignores_urls: true

cyclomatic_complexity:
  warning: 15
  error: 20

file_length:
  warning: 800
  error: 1200

type_body_length:
  warning: 450
  error: 600

function_body_length:
  warning: 100
  error: 150

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
    error: 70
  excluded:
    - id
    - io
    - to
    - at
    - in
    - fs
    - op
    - vm

todo:
  severity: warning
